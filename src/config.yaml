site:
  name: Your Business Name
  site: 'https://yourdomain.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: # Add your Google verification ID here

# Default SEO metadata
metadata:
  title:
    default: Your Business Name
    template: '%s — Your Business Name'
  description: "Professional services you can trust. Serving [Your City] and surrounding areas."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Your Business Name
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@yourbusiness'
    site: '@yourbusiness'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
