site:
  name: WW Lawncare & Services
  site: 'https://wwlawncare.com'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: WW Lawncare & Services — Precision Meets Nature
    template: '%s — WW Lawncare & Services'
  description: "Precision Meets Nature. Professional lawn mowing, mulching, and exterior window washing. Serving your community with quality and care."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: WW Lawncare & Services
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@wwlawncare'
    site: '@wwlawncare'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6
    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system'
